# Docker Compose configuration for development and production
services:
  web:
    image: ${WEB_IMAGE:-f4zination/magliosite:latest}
    pull_policy: always
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    depends_on:
      - web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/elisamaglio.de:/etc/ssl/elisamaglio.de:ro
